name: Deploy to cPanel (manual)

# Manual-only trigger: run this from the Actions tab whenever you want to
# push the current state of a branch to your cPanel-hosted site.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
      php_version:
        description: "PHP version to build against (should match the version selected in cPanel's MultiPHP Manager)"
        required: true
        default: "8.2"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout ${{ github.event.inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup PHP ${{ github.event.inputs.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ github.event.inputs.php_version }}
          tools: composer:v2
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Everything below runs entirely from this runner, which has PHP,
      # Composer and Node available. cPanel shared hosting usually does NOT
      # have Node in the SSH PATH, so we build here and ship the finished
      # vendor/ and public/build/ directories over instead of building on
      # the server itself.
      #
      # IMPORTANT: this action (burnett01/rsync-deployments) has NO separate
      # `exclude` input -- passing one is silently ignored (you just get an
      # "Unexpected input" warning in the log). Exclusions MUST be rsync
      # flags baked directly into `switches`, or they don't apply at all.
      #
      # We also deliberately do NOT pass --delete here. --delete makes rsync
      # remove anything on the server that isn't present in this runner's
      # checkout, which is only safe if every excluded path is 100% correct
      # -- one missed pattern silently wipes files (this is exactly what
      # deleted production .env and .git on the first version of this
      # workflow). Without --delete, stale files are left behind instead of
      # deleted, which is a far safer default failure mode. Only add
      # --delete back if you specifically need it, and double-check the
      # exclude list first.
      - name: Deploy files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr
            --exclude=.env
            --exclude=.env.*
            --exclude=.git/
            --exclude=.github/
            --exclude=node_modules/
            --exclude=tests/
            --exclude=storage/app/
            --exclude=storage/framework/cache/
            --exclude=storage/framework/sessions/
            --exclude=storage/framework/views/
            --exclude=storage/logs/
          path: ./
          remote_path: ${{ secrets.CPANEL_DEPLOY_PATH }}
          remote_host: ${{ secrets.CPANEL_SSH_HOST }}
          remote_port: ${{ secrets.CPANEL_SSH_PORT }}
          remote_user: ${{ secrets.CPANEL_SSH_USERNAME }}
          remote_key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}

      - name: Run post-deploy commands on cPanel
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.CPANEL_DEPLOY_PATH }}"

            # cPanel's default `php` on PATH can be an old/unrelated version.
            # Point this at the binary MultiPHP Manager uses for this domain,
            # e.g. /opt/cpanel/ea-php82/root/usr/bin/php. Falls back to
            # whatever `php` resolves to if the secret isn't set.
            PHP_BIN="${{ secrets.CPANEL_PHP_BIN }}"
            if [ -z "$PHP_BIN" ]; then PHP_BIN="php"; fi

            # Re-create any storage subfolders rsync's exclude list stripped
            # and make sure the web server can still write to them.
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
            chmod -R 775 storage bootstrap/cache

            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache
            "$PHP_BIN" artisan storage:link || true
